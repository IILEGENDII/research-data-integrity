name: Local integrity checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q -rs
      - run: python -m research_integrity --help
      - name: Verify installed command with disposable files
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory

          def cli(*args):
              return subprocess.check_output(["research-integrity", *map(str, args)], text=True)

          with TemporaryDirectory() as directory:
              demo = Path(directory).resolve() / "demo"
              cli("demo", "--output", demo)
              manifest = demo / "control" / "base.json"
              cli("baseline", demo / "data", "--output", manifest, "--unsigned")
              report = json.loads(cli("verify", demo / "data", "--manifest", manifest,
                                      "--allow-unsigned", "--format", "json"))
              assert report["result"] == "clean"
              assert report["manifest_trust"] == "unauthenticated"
              assert report["summary"]["unchanged"] == 3
