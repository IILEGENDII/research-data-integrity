[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-data-integrity"
version = "0.1.0"
description = "Verify local datasets against signed SHA-256 inventories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cryptography>=45"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "build>=1.2"]

[project.scripts]
research-integrity = "research_integrity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 96
extend-exclude = [".local"]
